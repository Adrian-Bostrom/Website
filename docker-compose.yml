services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /app/data/website.sqlite
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend-builder:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - frontend_dist:/app/frontend/dist
    command: >
      sh -c "npm install && npm run build && cp -R frontend/dist/. /tmp/frontend-dist/ && mkdir -p /app/frontend/dist && cp -R /tmp/frontend-dist/. /app/frontend/dist/"

  frontend:
    image: nginx:alpine
    depends_on:
      - backend
      - frontend-builder
    ports:
      - "8080:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  frontend_dist:
